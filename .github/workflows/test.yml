name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Bridge on Python ${{ matrix.python }}
    # Ubuntu 22.04 still has Python 3.8 builds for setup-python.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # FDM installs Python 3.8 for add-ons that need features level 1, as this one does.
        python: ['3.8', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  javascript:
    name: Parsers on Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/parsers.test.js
